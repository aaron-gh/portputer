[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# Windows builds are cross-compiled on the Mac with MinGW-w64 (brew install mingw-w64).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
# MinGW's runtimes linked in, so no MinGW DLLs are needed on Windows.
rustflags = ["-C", "link-args=-static -static-libgcc", "-C", "strip=symbols"]
