[package]
name = "portputer-windows-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional local Windows secure-desktop input broker (experimental)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Memory", "Win32_System_IO", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Environment"] }

[[bin]]
name = "portputer-input-service"
path = "src/main.rs"
